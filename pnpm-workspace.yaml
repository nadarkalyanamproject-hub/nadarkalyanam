packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
# Security floors for packages pulled in by other packages (pnpm audit /
# Dependabot). Remove an entry once the parent package ships the fix itself.
overrides:
  multer: ^2.5.0
  body-parser: ^2.4.0
  qs: ^6.16.1
  fast-uri: ^3.1.9
  sharp: ^0.35.5
  source-map-js: ^1.2.2
  mysql2: ^3.23.1
  deepmerge-ts: ^8.0.2
  vite@>=7.0.0 <7.3.7: ^7.3.7
  glob@>=9.0.0 <14.0.2: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  zod@<4.6.6: ^4.6.6
