services:
  postgres:
    image: postgres:17-alpine
    container_name: nadar-kalyanam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nadar
      POSTGRES_PASSWORD: nadar_dev_password
      POSTGRES_DB: nadar_kalyanam
    ports:
      - "5439:5432"
    volumes:
      - nadar_kalyanam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nadar -d nadar_kalyanam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nadar-kalyanam-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - nadar_kalyanam_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for profile photos. MinIO no longer publishes
  # pullable images (docker.io/minio/* -> pull access denied, quay.io/minio/*
  # -> 401), so this uses Chainguard's maintained MinIO build. It is the same
  # MinIO server and also bundles `mc` and `sh` (used by the healthcheck and
  # minio-init below).
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: nadar-kalyanam-minio
    restart: unless-stopped
    # The image defaults to a non-root user (65532), which cannot write to a
    # data volume created by the old root-run image ("Unable to write to the
    # backend"). Running as root keeps existing volumes working, as before.
    user: "0:0"
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: nadar_minio
      MINIO_ROOT_PASSWORD: nadar_minio_password
    ports:
      - "9002:9000" # S3 API
      - "9003:9003" # Web console
    volumes:
      - nadar_kalyanam_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init: MinIO does not auto-create buckets on startup, so this
  # creates the bucket and makes objects in it publicly readable (profile
  # photos are displayed via plain GET URLs, not gated behind auth in this
  # phase). It also restricts CORS to the web app's origin so the browser
  # can PUT directly to a pre-signed URL from http://localhost:3002.
  #
  # Note: MinIO's per-bucket S3 CORS API (`mc cors set`, the AWS-compatible
  # PutBucketCors) is NOT implemented by this server version — confirmed by
  # running it, it fails with "functionality that is not implemented".
  # MinIO's actual supported mechanism is the server-wide `api
  # cors_allow_origin` config value (default "*", i.e. CORS-open by
  # default), which requires a service restart to take effect. That's what
  # this does instead.
  #
  # Runs once per `docker compose up` and exits; safe to re-run (`mb -p`
  # ignores an already-existing bucket, and re-applying the same config/
  # policy is a no-op).
  #
  # Uses the same image as the server: it includes `mc` and a shell, which
  # the entrypoint below needs (Chainguard's separate minio-client image has
  # no shell).
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: nadar-kalyanam-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nadar_minio nadar_minio_password &&
      mc mb --ignore-existing local/nadar-kalyanam-photos &&
      mc anonymous set download local/nadar-kalyanam-photos &&
      mc admin config set local api cors_allow_origin=http://localhost:3002 &&
      mc admin service restart local --json
      "

volumes:
  nadar_kalyanam_postgres_data:
  nadar_kalyanam_redis_data:
  nadar_kalyanam_minio_data:
